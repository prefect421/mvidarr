<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Song Recommendations</title>
</head>
<body>
    <h1>Song Recommendations Test</h1>
    
    <div id="songRecommendationsContent">
        <div class="empty-state">
            <p>No song recommendations available</p>
            <p class="empty-state-hint">Use "Enrich from All Services" to populate song recommendations.</p>
        </div>
    </div>
    
    <button onclick="testRender()">Test Render Function</button>
    
    <script>
        // Copy the exact render function from the artist page
        function renderSongRecommendations(tracks) {
            const content = document.getElementById('songRecommendationsContent');
            if (!content) return;
            
            console.log('🎵 renderSongRecommendations called with:', tracks);
            
            if (tracks && tracks.length > 0) {
                let html = '<ul class="song-list">';
                tracks.forEach(track => {
                    // Handle both string and object formats
                    const trackName = typeof track === 'string' ? track : (track.name || track);
                    const searchUrl = `/discover?q=${encodeURIComponent(trackName)}`;
                    html += `
                        <li class="song-item">
                            <a href="${searchUrl}" class="song-title" title="Search for ${trackName}">
                                ${trackName}
                            </a>
                        </li>
                    `;
                });
                html += '</ul>';
                content.innerHTML = html;
            } else {
                content.innerHTML = `
                    <div class="empty-state">
                        <p>No song recommendations available</p>
                        <p class="empty-state-hint">Use "Enrich from All Services" to populate song recommendations.</p>
                    </div>
                `;
            }
        }
        
        function testRender() {
            // Test with the actual data from the API
            const testTracks = [
                "SEXY NUKIM",
                "Narani Narani (feat. ATARASHII GAKKO!)",
                "Buriburi",
                "Armadillo (feat. Omega Sapien & Byung un)",
                "Wash Away"
            ];
            
            console.log('Testing renderSongRecommendations with:', testTracks);
            renderSongRecommendations(testTracks);
        }
    </script>
</body>
</html>
