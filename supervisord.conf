[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:pot-provider]
; bgutil-ytdlp-pot-provider server (#452): generates the PO tokens yt-dlp
; needs to bypass YouTube's SABR/bot-detection gating. Started before
; fastapi/celery (lower priority number = earlier start) so downloads
; never race an unready server on a cold container start; yt-dlp falls
; back gracefully (with a logged warning) if it's briefly unreachable.
command=node /app/vendor/bgutil-ytdlp-pot-provider/server/build/main.js
directory=/app/vendor/bgutil-ytdlp-pot-provider/server
user=mvidarr
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/pot-provider.log
stderr_logfile=/app/data/logs/pot-provider_error.log
priority=900

[program:fastapi]
command=python3 /app/fastapi_app.py
directory=/app
user=mvidarr
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/fastapi.log
stderr_logfile=/app/data/logs/fastapi_error.log
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

[program:celery-worker]
command=celery -A src.jobs.celery_app worker --loglevel=info --concurrency=3 --queues=scheduler,default
directory=/app
user=mvidarr
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/celery-worker.log
stderr_logfile=/app/data/logs/celery-worker_error.log
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stopwaitsecs=60
priority=999

[program:celery-beat]
command=celery -A src.jobs.celery_app beat --loglevel=info
directory=/app
user=mvidarr
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/celery-beat.log
stderr_logfile=/app/data/logs/celery-beat_error.log
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stopwaitsecs=10
priority=998

