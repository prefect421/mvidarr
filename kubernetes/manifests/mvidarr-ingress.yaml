---
# Nginx Ingress Controller Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mvidarr-ingress
  namespace: mvidarr
  labels:
    app: mvidarr
    component: ingress
  annotations:
    # Ingress class and controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    
    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Security Headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Upload Size
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/client-max-body-size: "500m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-set-headers: "mvidarr/websocket-headers"
    
    # Monitoring
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
spec:
  tls:
  - hosts:
    - mvidarr.example.com
    - api.mvidarr.example.com
    - monitoring.mvidarr.example.com
    secretName: mvidarr-tls-secret
  rules:
  # Main application
  - host: mvidarr.example.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 80
  # API Gateway
  - host: api.mvidarr.example.com
    http:
      paths:
      - path: /api/(.*)
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 80
      - path: /gateway/(.*)
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 80
  # Monitoring and Metrics
  - host: monitoring.mvidarr.example.com
    http:
      paths:
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 80
---
# ConfigMap for custom headers
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-headers
  namespace: mvidarr
  labels:
    app: mvidarr
    component: ingress-config
data:
  # WebSocket upgrade headers
  Upgrade: "$http_upgrade"
  Connection: "$connection_upgrade"
  Host: "$host"
  X-Real-IP: "$remote_addr"
  X-Forwarded-For: "$proxy_add_x_forwarded_for"
  X-Forwarded-Proto: "$scheme"
  X-Forwarded-Host: "$host"
---
# Cert-Manager ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: mvidarr
    component: certificate-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@mvidarr.example.com  # Change to your email
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
          podTemplate:
            spec:
              nodeSelector:
                "kubernetes.io/os": linux
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
---
# Development/Staging ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: mvidarr
    component: certificate-issuer
    environment: staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@mvidarr.example.com
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Certificate resource for automatic SSL certificate generation
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mvidarr-certificate
  namespace: mvidarr
  labels:
    app: mvidarr
    component: certificate
spec:
  secretName: mvidarr-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - mvidarr.example.com
  - api.mvidarr.example.com
  - monitoring.mvidarr.example.com
  - "*.mvidarr.example.com"  # Wildcard certificate
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
---
# Alternative Ingress for internal services (no SSL)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mvidarr-internal-ingress
  namespace: mvidarr
  labels:
    app: mvidarr
    component: internal-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Internal network access only
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
spec:
  rules:
  # Internal monitoring endpoints
  - host: internal.mvidarr.local
    http:
      paths:
      - path: /database/metrics
        pathType: Prefix
        backend:
          service:
            name: mvidarr-database-service
            port:
              number: 9104
      - path: /redis/metrics
        pathType: Prefix
        backend:
          service:
            name: mvidarr-redis-service
            port:
              number: 9121
      - path: /api/admin/(.*)
        pathType: Prefix
        backend:
          service:
            name: mvidarr-api-service
            port:
              number: 80
---
# Network Policy for Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mvidarr-ingress-network-policy
  namespace: mvidarr
  labels:
    app: mvidarr
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: mvidarr-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress controller traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 8080
  # Allow internal cluster traffic
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5000
  egress:
  # Allow database connections
  - to:
    - podSelector:
        matchLabels:
          app: mvidarr-database
    ports:
    - protocol: TCP
      port: 3306
  # Allow Redis connections
  - to:
    - podSelector:
        matchLabels:
          app: mvidarr-redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow external HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80