---
apiVersion: v1
kind: Namespace
metadata:
  name: mvidarr
  labels:
    name: mvidarr
    app.kubernetes.io/name: mvidarr
    app.kubernetes.io/version: "0.9.8"
    app.kubernetes.io/component: namespace
  annotations:
    description: "MVidarr Music Video Management System"
    owner: "mvidarr-team"
    environment: "production"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mvidarr-resource-quota
  namespace: mvidarr
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8" 
    limits.memory: 16Gi
    persistentvolumeclaims: "5"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mvidarr-limit-range
  namespace: mvidarr
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
  - max:
      cpu: "2"
      memory: 2Gi
    min:
      cpu: 50m
      memory: 64Mi
    type: Container