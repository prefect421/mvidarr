---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mvidarr-database-pvc
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mvidarr-database
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
    version: "10.6"
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: "10.6"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mvidarr
spec:
  serviceName: mvidarr-database-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mvidarr-database
      component: database
  template:
    metadata:
      labels:
        app: mvidarr-database
        component: database
        version: "10.6"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.6
        imagePullPolicy: IfNotPresent
        ports:
        - name: mysql
          containerPort: 3306
          protocol: TCP
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mvidarr-database-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: mvidarr
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mvidarr-database-secret
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mvidarr-database-secret
              key: password
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -p${MYSQL_ROOT_PASSWORD}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mysql
            - -h
            - localhost
            - -u
            - root
            - -p${MYSQL_ROOT_PASSWORD}
            - -e
            - SELECT 1
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: database-storage
          mountPath: /var/lib/mysql
        - name: database-config
          mountPath: /etc/mysql/conf.d
          readOnly: true
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
            - ALL
      - name: mysqld-exporter
        image: prom/mysqld-exporter:v0.14.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9104
          protocol: TCP
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: mvidarr-database-secret
              key: metrics-dsn
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
      volumes:
      - name: database-config
        configMap:
          name: mvidarr-database-config
      - name: init-scripts
        configMap:
          name: mvidarr-database-init
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: database-storage
      labels:
        app: mvidarr-database
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mvidarr-database-service
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
spec:
  type: ClusterIP
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
    protocol: TCP
  - name: metrics
    port: 9104
    targetPort: metrics
    protocol: TCP
  selector:
    app: mvidarr-database
    component: database
---
apiVersion: v1
kind: Service
metadata:
  name: mvidarr-database-headless
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
    protocol: TCP
  selector:
    app: mvidarr-database
    component: database
---
apiVersion: v1
kind: Secret
metadata:
  name: mvidarr-database-secret
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
type: Opaque
stringData:
  root-password: "mvidarr-root-password-change-in-production"
  username: "mvidarr"
  password: "mvidarr-password-change-in-production"
  metrics-dsn: "mvidarr:mvidarr-password-change-in-production@tcp(localhost:3306)/mvidarr"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mvidarr-database-config
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
data:
  my.cnf: |
    [mysqld]
    # Performance settings
    innodb_buffer_pool_size = 2G
    innodb_log_file_size = 256M
    innodb_flush_method = O_DIRECT
    innodb_flush_log_at_trx_commit = 1
    
    # Connection settings
    max_connections = 200
    max_connect_errors = 1000
    
    # Query cache
    query_cache_type = 1
    query_cache_size = 128M
    query_cache_limit = 2M
    
    # Logging
    slow_query_log = 1
    slow_query_log_file = /var/lib/mysql/slow.log
    long_query_time = 2
    
    # Character set
    character_set_server = utf8mb4
    collation_server = utf8mb4_unicode_ci
    
    # Binary logging
    log_bin = mysql-bin
    binlog_format = ROW
    expire_logs_days = 7
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mvidarr-database-init
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: database
data:
  001-init.sql: |
    -- MVidarr Database Initialization
    CREATE DATABASE IF NOT EXISTS mvidarr;
    USE mvidarr;
    
    -- Grant privileges
    GRANT ALL PRIVILEGES ON mvidarr.* TO 'mvidarr'@'%';
    FLUSH PRIVILEGES;
    
    -- Create monitoring user for metrics
    CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY 'exporter-password';
    GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
    FLUSH PRIVILEGES;