---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mvidarr-config
  namespace: mvidarr
  labels:
    app: mvidarr
    component: config
data:
  # Application Configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  
  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "5000"
  WORKERS: "4"
  WORKER_CLASS: "uvicorn.workers.UvicornWorker"
  
  # Media Configuration
  MEDIA_ROOT: "/app/media"
  THUMBNAILS_ROOT: "/app/media/thumbnails"
  TEMP_ROOT: "/app/temp"
  MAX_UPLOAD_SIZE: "500MB"
  
  # Processing Configuration
  VIDEO_FORMATS: "mp4,mkv,avi,mov,wmv,flv,webm"
  AUDIO_FORMATS: "mp3,wav,flac,aac,m4a,ogg"
  IMAGE_FORMATS: "jpg,jpeg,png,gif,webp,bmp"
  
  # FFmpeg Configuration
  FFMPEG_THREADS: "4"
  FFMPEG_TIMEOUT: "300"
  THUMBNAIL_SIZE: "320x240"
  
  # API Configuration
  API_VERSION: "v1"
  API_GATEWAY_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  
  # Monitoring Configuration
  MONITORING_ENABLED: "true"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"
  
  # Security Configuration
  SESSION_TIMEOUT: "3600"
  CORS_ORIGINS: "*"
  SECURE_HEADERS: "true"
  
  # Background Jobs
  CELERY_BROKER_POOL_LIMIT: "10"
  CELERY_RESULT_EXPIRES: "3600"
  TASK_TIMEOUT: "1800"
  MAX_RETRIES: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: mvidarr-secrets
  namespace: mvidarr
  labels:
    app: mvidarr
    component: secrets
type: Opaque
stringData:
  # Database Configuration
  database-url: "mysql+pymysql://mvidarr:mvidarr-password-change-in-production@mvidarr-database-service:3306/mvidarr"
  database-host: "mvidarr-database-service"
  database-port: "3306"
  database-name: "mvidarr"
  database-user: "mvidarr"
  database-password: "mvidarr-password-change-in-production"
  
  # Redis Configuration
  redis-url: "redis://:redis-password-change-in-production@mvidarr-redis-service:6379/0"
  redis-host: "mvidarr-redis-service"
  redis-port: "6379"
  redis-password: "redis-password-change-in-production"
  redis-db: "0"
  
  # Session Secret Key
  session-secret-key: "mvidarr-session-secret-change-in-production-super-long-key-for-security"
  
  # API Keys and Tokens
  jwt-secret-key: "mvidarr-jwt-secret-change-in-production"
  api-gateway-token: "gateway-token-change-in-production"
  
  # External Service API Keys
  youtube-api-key: "your-youtube-api-key-here"
  spotify-client-id: "your-spotify-client-id-here"
  spotify-client-secret: "your-spotify-client-secret-here"
  
  # Monitoring and Observability
  prometheus-token: "prometheus-access-token"
  jaeger-endpoint: "http://jaeger-collector:14268/api/traces"
  
  # Email Configuration (if needed)
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-user: "your-email@gmail.com"
  smtp-password: "your-app-password"
  
  # Cloud Storage (if using)
  aws-access-key-id: "your-aws-access-key"
  aws-secret-access-key: "your-aws-secret-key"
  s3-bucket-name: "mvidarr-media-storage"
---
# Development override ConfigMap (for dev environment)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mvidarr-dev-config
  namespace: mvidarr
  labels:
    app: mvidarr
    component: config
    environment: development
data:
  ENVIRONMENT: "development"
  DEBUG: "true"
  LOG_LEVEL: "DEBUG"
  WORKERS: "1"
  CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
---
# SSL/TLS Certificate Secret (placeholder - use cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: mvidarr-tls-secret
  namespace: mvidarr
  labels:
    app: mvidarr
    component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and private key
  # In production, use cert-manager to automatically manage certificates
  tls.crt: LS0tLS1CRUdJTi...  # placeholder - replace with actual certificate
  tls.key: LS0tLS1CRUdJTi...  # placeholder - replace with actual private key