---
# API Service Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mvidarr-api-hpa
  namespace: mvidarr
  labels:
    app: mvidarr-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mvidarr-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metrics-based scaling
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  # External metrics scaling (optional)
  - type: External
    external:
      metric:
        name: queue_length
        selector:
          matchLabels:
            queue: "mvidarr-processing"
      target:
        type: Value
        value: "30"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
---
# Redis Horizontal Pod Autoscaler (if using Redis Cluster)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mvidarr-redis-hpa
  namespace: mvidarr
  labels:
    app: mvidarr-redis
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mvidarr-redis
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  # Redis-specific metrics
  - type: Pods
    pods:
      metric:
        name: redis_connected_clients
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 180
      selectPolicy: Min
---
# Vertical Pod Autoscaler for Database (StatefulSet doesn't use HPA)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mvidarr-database-vpa
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: autoscaling
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mvidarr-database
  updatePolicy:
    updateMode: "Auto"  # Can be "Off", "Initial", or "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: mariadb
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: 4000m
        memory: 8Gi
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsAndLimits
    - containerName: mysqld-exporter
      mode: "Off"  # Don't autoscale monitoring sidecar
---
# PodDisruptionBudget for API Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mvidarr-api-pdb
  namespace: mvidarr
  labels:
    app: mvidarr-api
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mvidarr-api
      component: api
---
# PodDisruptionBudget for Redis
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mvidarr-redis-pdb
  namespace: mvidarr
  labels:
    app: mvidarr-redis
    component: availability
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: mvidarr-redis
      component: cache
---
# PodDisruptionBudget for Database
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mvidarr-database-pdb
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: availability
spec:
  maxUnavailable: 0  # Never allow database disruption
  selector:
    matchLabels:
      app: mvidarr-database
      component: database