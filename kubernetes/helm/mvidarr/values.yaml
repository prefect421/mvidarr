# Default values for MVidarr
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: "docker.io"
  imagePullSecrets: []
  storageClass: "fast-ssd"

# Application configuration
app:
  name: mvidarr
  version: "0.9.8"
  environment: production
  logLevel: INFO
  debug: false

# Image configuration
image:
  registry: docker.io
  repository: mvidarr/api
  tag: "0.9.8"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment configuration
replicaCount: 3

# Resource configuration
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: mvidarr.example.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.mvidarr.example.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /gateway
          pathType: Prefix
  tls:
    - secretName: mvidarr-tls-secret
      hosts:
        - mvidarr.example.com
        - api.mvidarr.example.com

# Storage configuration
storage:
  media:
    enabled: true
    size: 100Gi
    accessMode: ReadWriteMany
    storageClass: fast-ssd
  thumbnails:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteMany
    storageClass: fast-ssd
  temp:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteMany
    storageClass: fast-ssd

# Database configuration
database:
  # Use external database
  external:
    enabled: false
    host: ""
    port: 3306
    database: mvidarr
    username: mvidarr
    password: ""
    
  # Use MariaDB subchart
  mariadb:
    enabled: true
    auth:
      rootPassword: "mvidarr-root-password-change-in-production"
      database: mvidarr
      username: mvidarr
      password: "mvidarr-password-change-in-production"
    architecture: standalone
    primary:
      persistence:
        enabled: true
        size: 20Gi
        storageClass: fast-ssd
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "redis-password-change-in-production"
  architecture: standalone
  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Security configuration
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL

  networkPolicy:
    enabled: true
    ingress:
      enabled: true
    egress:
      enabled: true

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

# RBAC
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list"]

# Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /api/monitoring/metrics
    port: metrics
  
  prometheus:
    enabled: true
  
  grafana:
    enabled: true

# Certificate management
certManager:
  enabled: true
  issuer:
    name: letsencrypt-prod
    email: admin@mvidarr.example.com
    server: https://acme-v02.api.letsencrypt.org/directory

# Application-specific configuration
config:
  # Media settings
  media:
    maxUploadSize: "500MB"
    videoFormats: "mp4,mkv,avi,mov,wmv,flv,webm"
    audioFormats: "mp3,wav,flac,aac,m4a,ogg"
    imageFormats: "jpg,jpeg,png,gif,webp,bmp"
  
  # Processing settings
  processing:
    ffmpegThreads: 4
    ffmpegTimeout: 300
    thumbnailSize: "320x240"
    taskTimeout: 1800
    maxRetries: 3
  
  # API settings
  api:
    version: "v1"
    gatewayEnabled: true
    rateLimitEnabled: true
    rateLimitRequests: 100
    rateLimitWindow: 60
  
  # Security settings
  session:
    timeout: 3600
    secretKey: "mvidarr-session-secret-change-in-production-super-long-key-for-security"
  
  jwt:
    secretKey: "mvidarr-jwt-secret-change-in-production"

# External services
externalServices:
  youtube:
    apiKey: ""
  spotify:
    clientId: ""
    clientSecret: ""

# Node selection and tolerations
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mvidarr
          topologyKey: kubernetes.io/hostname

# Additional volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Additional environment variables
extraEnv: []

# Additional containers
extraContainers: []

# Init containers
initContainers: []