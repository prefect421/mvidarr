# Staging environment overrides
replicaCount: 2

image:
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

app:
  environment: staging
  logLevel: INFO
  debug: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

database:
  mariadb:
    enabled: true
    auth:
      rootPassword: "staging-root-password-change-me"
      password: "staging-password-change-me"
    primary:
      persistence:
        size: 10Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

redis:
  enabled: true
  auth:
    password: "staging-redis-password-change-me"
  master:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 75m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 512Mi

storage:
  media:
    size: 25Gi
  thumbnails:
    size: 5Gi
  temp:
    size: 10Gi

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: staging.mvidarr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mvidarr-staging-tls
      hosts:
        - staging.mvidarr.example.com

certManager:
  enabled: true
  issuer:
    name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory

config:
  session:
    secretKey: "staging-session-secret-change-in-production"
  jwt:
    secretKey: "staging-jwt-secret-change-in-production"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true