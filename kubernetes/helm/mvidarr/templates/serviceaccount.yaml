{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mvidarr.serviceAccountName" . }}
  namespace: {{ include "mvidarr.namespace" . }}
  labels:
    {{- include "mvidarr.labels" . | nindent 4 }}
    component: service-account
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}