apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mvidarr.fullname" . }}-secrets
  namespace: {{ include "mvidarr.namespace" . }}
  labels:
    {{- include "mvidarr.labels" . | nindent 4 }}
    component: secrets
type: Opaque
stringData:
  # Database Configuration
  database-url: {{ include "mvidarr.databaseUrl" . }}
  {{- if .Values.database.external.enabled }}
  database-host: {{ .Values.database.external.host | quote }}
  database-port: {{ .Values.database.external.port | quote }}
  database-name: {{ .Values.database.external.database | quote }}
  database-user: {{ .Values.database.external.username | quote }}
  database-password: {{ .Values.database.external.password | quote }}
  {{- else }}
  database-host: {{ printf "%s-mariadb" .Release.Name | quote }}
  database-port: "3306"
  database-name: {{ .Values.database.mariadb.auth.database | quote }}
  database-user: {{ .Values.database.mariadb.auth.username | quote }}
  database-password: {{ .Values.database.mariadb.auth.password | quote }}
  {{- end }}
  
  # Redis Configuration
  redis-url: {{ include "mvidarr.redisUrl" . }}
  redis-host: {{ printf "%s-redis-master" .Release.Name | quote }}
  redis-port: "6379"
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | quote }}
  {{- end }}
  redis-db: "0"
  
  # Session Secret Key
  session-secret-key: {{ .Values.config.session.secretKey | quote }}
  
  # JWT Secret Key
  jwt-secret-key: {{ .Values.config.jwt.secretKey | quote }}
  
  # API Gateway Token
  api-gateway-token: "gateway-token-change-in-production"
  
  # External Service API Keys
  {{- if .Values.externalServices.youtube.apiKey }}
  youtube-api-key: {{ .Values.externalServices.youtube.apiKey | quote }}
  {{- end }}
  {{- if .Values.externalServices.spotify.clientId }}
  spotify-client-id: {{ .Values.externalServices.spotify.clientId | quote }}
  {{- end }}
  {{- if .Values.externalServices.spotify.clientSecret }}
  spotify-client-secret: {{ .Values.externalServices.spotify.clientSecret | quote }}
  {{- end }}
  
  # Monitoring and Observability
  prometheus-token: "prometheus-access-token"
  jaeger-endpoint: "http://jaeger-collector:14268/api/traces"