{{- if .Values.storage.media.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mvidarr.fullname" . }}-media-pvc
  namespace: {{ include "mvidarr.namespace" . }}
  labels:
    {{- include "mvidarr.labels" . | nindent 4 }}
    component: storage
    type: media
spec:
  accessModes:
    - {{ .Values.storage.media.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.media.size }}
  {{- if .Values.storage.media.storageClass }}
  storageClassName: {{ .Values.storage.media.storageClass }}
  {{- else if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
{{- end }}

