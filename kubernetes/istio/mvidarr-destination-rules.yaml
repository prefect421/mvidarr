---
# Destination Rule for API Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mvidarr-api-destination
  namespace: mvidarr
  labels:
    app: mvidarr
    component: destination-rule
spec:
  host: mvidarr-api-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 64
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 5
        consecutiveGatewayErrors: 3
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 50
        splitExternalLocalOriginErrors: false
    circuitBreaker:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    outlierDetection:
      consecutive5xxErrors: 3
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
  subsets:
  # Production subset (main traffic)
  - name: stable
    labels:
      version: v1
      environment: production
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  # Canary deployment subset
  - name: canary
    labels:
      version: v1
      environment: production
      canary: "true"
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
      connectionPool:
        tcp:
          maxConnections: 10
        http:
          http1MaxPendingRequests: 10
  # API v1 subset
  - name: v1
    labels:
      version: v1
      api-version: "1.0"
  # API v2 subset  
  - name: v2
    labels:
      version: v1
      api-version: "2.0"
---
# Destination Rule for Database Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mvidarr-database-destination
  namespace: mvidarr
  labels:
    app: mvidarr-database
    component: destination-rule
spec:
  host: mvidarr-database-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 10s
        keepAlive:
          time: 7200s
          interval: 75s
    circuitBreaker:
      consecutiveGatewayErrors: 3
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 25
      minHealthPercent: 75
  portLevelSettings:
  - port:
      number: 3306
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 10s
---
# Destination Rule for Redis Service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mvidarr-redis-destination
  namespace: mvidarr
  labels:
    app: mvidarr-redis
    component: destination-rule
spec:
  host: mvidarr-redis-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 25
        connectTimeout: 5s
        keepAlive:
          time: 3600s
          interval: 60s
    circuitBreaker:
      consecutiveGatewayErrors: 2
      consecutive5xxErrors: 2
      interval: 15s
      baseEjectionTime: 15s
      maxEjectionPercent: 50
      minHealthPercent: 50
  portLevelSettings:
  - port:
      number: 6379
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 25
        connectTimeout: 5s