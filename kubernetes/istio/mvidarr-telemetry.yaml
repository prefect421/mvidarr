---
# Telemetry configuration for distributed tracing
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mvidarr-tracing
  namespace: mvidarr
  labels:
    app: mvidarr
    component: telemetry
spec:
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        request_id:
          value: "%{REQUEST_ID}"
        correlation_id:
          value: "%{CORRELATION_ID}"
        user_id:
          value: "%{USER_ID}"
        api_version:
          value: "%{API_VERSION}"
    - match:
        metric: requests_total
      disabled: false
    - match:
        metric: request_duration_milliseconds
      disabled: false
  tracing:
  - providers:
    - name: jaeger
  accessLogging:
  - providers:
    - name: otel
---
# Custom metrics for API performance
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mvidarr-custom-metrics
  namespace: mvidarr
  labels:
    app: mvidarr
    component: telemetry
spec:
  selector:
    matchLabels:
      app: mvidarr-api
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: requests_total
      tagOverrides:
        endpoint:
          value: "%{REQUEST_PROTOCOL}://%{REQUEST_HOST}%{REQUEST_URL_PATH}"
        status_class:
          value: |
            has(response.code) ?
              (response.code >= 200 && response.code < 300 ? "2xx" :
               response.code >= 300 && response.code < 400 ? "3xx" :
               response.code >= 400 && response.code < 500 ? "4xx" :
               response.code >= 500 ? "5xx" : "unknown") : "unknown"
        method:
          value: "%{REQUEST_METHOD}"
        api_version:
          value: "%{REQUEST_HEADERS['Accept-Version']}"
        user_agent:
          value: "%{REQUEST_HEADERS['User-Agent']}"
    - match:
        metric: request_duration_milliseconds
      tagOverrides:
        endpoint:
          value: "%{REQUEST_PROTOCOL}://%{REQUEST_HOST}%{REQUEST_URL_PATH}"
        method:
          value: "%{REQUEST_METHOD}"
        api_version:
          value: "%{REQUEST_HEADERS['Accept-Version']}"
---
# Wasm extension for custom request processing
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: mvidarr-request-processor
  namespace: mvidarr
  labels:
    app: mvidarr
    component: extension
spec:
  selector:
    matchLabels:
      app: mvidarr-api
  url: oci://ghcr.io/mvidarr/request-processor:latest
  phase: AUTHN
  pluginConfig:
    rate_limiting:
      enabled: true
      requests_per_minute: 100
      burst_size: 20
    request_logging:
      enabled: true
      log_level: "INFO"
      include_headers:
        - "User-Agent"
        - "Accept-Version"
        - "Authorization"
        - "X-Request-ID"
        - "X-Correlation-ID"
    security_headers:
      enabled: true
      add_headers:
        X-Content-Type-Options: "nosniff"
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    api_versioning:
      enabled: true
      default_version: "1.0"
      supported_versions: ["1.0", "1.1", "2.0"]
      header_name: "Accept-Version"
---
# Service Monitor for Prometheus integration
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mvidarr-istio-proxy
  namespace: mvidarr
  labels:
    app: mvidarr
    component: monitoring
spec:
  selector:
    matchLabels:
      app: mvidarr-api
  endpoints:
  - port: http-monitoring
    interval: 30s
    path: /stats/prometheus
    scheme: http
  - port: http-monitoring
    interval: 30s
    path: /api/monitoring/metrics
    scheme: http
---
# Envoy Filter for custom request handling
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: mvidarr-request-id
  namespace: mvidarr
  labels:
    app: mvidarr
    component: envoy-filter
spec:
  workloadSelector:
    labels:
      app: mvidarr-api
  configPatches:
  # Add request ID generation
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/udpa.type.v1.TypedStruct
          type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          value:
            stat_prefix: mvidarr_rate_limiter
            token_bucket:
              max_tokens: 100
              tokens_per_fill: 100
              fill_interval: 60s
            filter_enabled:
              runtime_key: rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
  # Add correlation ID header
  - applyTo: HTTP_ROUTE
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: MERGE
      value:
        request_headers_to_add:
        - header:
            key: "X-Correlation-ID"
            value: "%REQ(X-Correlation-ID)%{%DYNAMIC_METADATA(envoy.common:request_id)%}"
          append: false
        - header:
            key: "X-Request-Timestamp"
            value: "%START_TIME%"
          append: false