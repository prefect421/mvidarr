name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ published ]

# Global permissions for the workflow
permissions:
  contents: write
  packages: write
  actions: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: mvidarr_test
          MYSQL_USER: mvidarr
          MYSQL_PASSWORD: test_password
          MYSQL_CHARSET: utf8mb4
          MYSQL_COLLATION: utf8mb4_unicode_ci
          MARIADB_AUTO_UPGRADE: 1
        ports:
          - 3306:3306
        options: >-
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --tmpfs /var/lib/mysql-logs:rw,noexec,nosuid,size=128m
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmariadb-dev pkg-config ffmpeg
    
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8==6.1.0 black==26.3.1 isort
    
    - name: Create test environment file
      run: |
        cat > .env << EOF
        DB_HOST=localhost
        DB_PORT=3306
        DB_USER=mvidarr
        DB_PASSWORD=test_password
        DB_NAME=mvidarr_test
        SECRET_KEY=test_secret_key_for_ci
        DEBUG=true
        IMVDB_API_KEY=test_key
        YOUTUBE_API_KEY=test_key
        EOF
    
    - name: Create data directories
      run: |
        mkdir -p data/downloads data/thumbnails data/logs data/cache data/backups
    
    - name: Wait for MariaDB
      run: |
        timeout=180
        count=0
        echo "Waiting for MariaDB service to be ready..."
        
        # Install MariaDB client tools
        sudo apt-get update && sudo apt-get install -y mariadb-client
        
        while [ $count -lt $timeout ]; do
          if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent 2>/dev/null; then
            echo "MariaDB ping successful! Testing database connection..."
            if mysql -h 127.0.0.1 -P 3306 -u mvidarr -ptest_password -e "SELECT 1" mvidarr_test >/dev/null 2>&1; then
              echo "MariaDB is ready and database mvidarr_test is accessible!"
              break
            else
              echo "Ping successful but database connection failed, retrying..."
            fi
          fi
          echo "Waiting for MariaDB to be ready... ($count/$timeout seconds)"
          sleep 3
          count=$((count + 3))
        done
        if [ $count -ge $timeout ]; then
          echo "MariaDB failed to start within $timeout seconds"
          exit 1
        fi
    
    - name: Initialize database
      run: |
        python -c "
        from src.database.init_db import initialize_database
        initialize_database()
        "
    
    - name: Run linting
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting
      run: |
        black --check src/
        isort --profile black --check-only src/
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        safety check --json > safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          GIT_BRANCH=${{ github.ref_name }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Deploy to production
      run: |
        echo "Deployment step would go here"
        echo "This could involve:"
        echo "- Updating Docker Compose on production server"
        echo "- Running database migrations"
        echo "- Health checks"
        echo "- Rollback on failure"

  release:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'release'
    permissions:
      contents: write
      packages: write
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Create release assets
      run: |
        # Create source code archive more reliably
        # Create temporary directory to avoid file change issues
        mkdir -p /tmp/mvidarr-release
        
        # Copy specific directories and files to avoid concurrent file changes
        cp -r src/ frontend/ scripts/ /tmp/mvidarr-release/ 2>/dev/null || true
        cp -r docker/ /tmp/mvidarr-release/ 2>/dev/null || true
        cp *.py *.md *.json *.txt /tmp/mvidarr-release/ 2>/dev/null || true
        cp requirements*.txt /tmp/mvidarr-release/ 2>/dev/null || true
        cp Dockerfile* docker-compose*.yml /tmp/mvidarr-release/ 2>/dev/null || true
        cp .env.template /tmp/mvidarr-release/ 2>/dev/null || true
        
        # Create archive from temporary directory
        cd /tmp
        tar -czf $GITHUB_WORKSPACE/mvidarr-enhanced-${{ github.event.release.tag_name }}.tar.gz \
          mvidarr-release/
        cd $GITHUB_WORKSPACE
        
        # Create installation package more reliably
        mkdir -p release-package
        cp -r src/ frontend/ scripts/ release-package/ 2>/dev/null || true
        cp -r docker/ release-package/ 2>/dev/null || true
        cp app.py requirements.txt release-package/ 2>/dev/null || true
        cp docker-compose.production.yml Dockerfile.production release-package/ 2>/dev/null || true
        cp .env.template release-package/.env.example 2>/dev/null || true
        cp SETUP.md README.md release-package/ 2>/dev/null || true
        
        # Create installation archive from release-package directory  
        tar -czf mvidarr-enhanced-install-${{ github.event.release.tag_name }}.tar.gz \
          -C release-package .
    
    - name: Upload release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Wait a moment for release to be fully created
        sleep 5
        
        # Check if release exists and create assets list
        echo "Uploading assets to release ${{ github.event.release.tag_name }}"
        
        # Upload source code archive
        if [ -f "mvidarr-enhanced-${{ github.event.release.tag_name }}.tar.gz" ]; then
          echo "Uploading source archive..."
          gh release upload "${{ github.event.release.tag_name }}" \
            "mvidarr-enhanced-${{ github.event.release.tag_name }}.tar.gz" \
            --clobber || echo "Failed to upload source archive"
        fi
        
        # Upload installation package
        if [ -f "mvidarr-enhanced-install-${{ github.event.release.tag_name }}.tar.gz" ]; then
          echo "Uploading installation package..."
          gh release upload "${{ github.event.release.tag_name }}" \
            "mvidarr-enhanced-install-${{ github.event.release.tag_name }}.tar.gz" \
            --clobber || echo "Failed to upload installation package"
        fi
        
        # List final release assets
        echo "Final release assets:"
        gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name'