name: Kubernetes Deployment Pipeline

on:
  push:
    branches:
      - main
      # Disabled for dev - Kubernetes deployment not needed for self-hosted target audience
      # - dev
    paths:
      - 'kubernetes/**'
      - 'docker/**'
      - 'Dockerfile*'
      - 'src/**'
      - '.github/workflows/kubernetes-deployment.yml'
  pull_request:
    branches:
      - main
      # Disabled for dev
      # - dev
    paths:
      - 'kubernetes/**'
      - 'docker/**'
      - 'Dockerfile*'
      - 'src/**'
      - '.github/workflows/kubernetes-deployment.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      helm_upgrade:
        description: 'Force Helm Upgrade'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_VERSION: '3.12.0'
  KUBECTL_VERSION: '1.27.0'
  KUSTOMIZE_VERSION: '5.0.1'

jobs:
  # Validate Kubernetes manifests and Helm charts
  validate:
    name: Validate Kubernetes Configurations
    runs-on: ubuntu-latest
    outputs:
      manifests-changed: ${{ steps.changes.outputs.manifests }}
      helm-changed: ${{ steps.changes.outputs.helm }}
      istio-changed: ${{ steps.changes.outputs.istio }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            manifests:
              - 'kubernetes/manifests/**'
            helm:
              - 'kubernetes/helm/**'
            istio:
              - 'kubernetes/istio/**'
            src:
              - 'src/**'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${HELM_VERSION}

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."
          python3 test_kubernetes_deployment.py

      - name: Validate Helm chart
        run: |
          echo "Validating Helm chart..."
          helm lint kubernetes/helm/mvidarr
          helm template mvidarr kubernetes/helm/mvidarr --values kubernetes/helm/mvidarr/values.yaml --dry-run

      - name: Security scan Kubernetes manifests
        uses: azure/k8s-lint@v1
        with:
          manifests: |
            kubernetes/manifests/mvidarr-*.yaml

      - name: Kubeval validation
        run: |
          # Install kubeval
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/
          
          # Validate manifests
          find kubernetes/manifests -name "*.yaml" -exec kubeval {} \;

  # Build and push Docker image
  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # Deploy to development environment
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    environment:
      name: development
      url: https://dev.mvidarr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${HELM_VERSION}

      - name: Deploy with Helm
        run: |
          helm upgrade --install mvidarr-dev kubernetes/helm/mvidarr \
            --namespace mvidarr-dev \
            --create-namespace \
            --values kubernetes/helm/mvidarr/values.yaml \
            --values kubernetes/helm/mvidarr/values-dev.yaml \
            --set image.tag="${{ github.sha }}" \
            --set app.environment="development" \
            --set ingress.hosts[0].host="dev.mvidarr.example.com" \
            --wait \
            --timeout=10m

      - name: Verify deployment
        run: |
          kubectl get pods -n mvidarr-dev
          kubectl rollout status deployment/mvidarr-dev -n mvidarr-dev --timeout=300s

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Test health endpoint
          kubectl port-forward -n mvidarr-dev service/mvidarr-dev 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 5
          
          curl -f http://localhost:8080/health || exit 1
          kill $PORT_FORWARD_PID

  # Deploy to staging environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: https://staging.mvidarr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${HELM_VERSION}

      - name: Deploy with Helm
        run: |
          helm upgrade --install mvidarr-staging kubernetes/helm/mvidarr \
            --namespace mvidarr-staging \
            --create-namespace \
            --values kubernetes/helm/mvidarr/values.yaml \
            --values kubernetes/helm/mvidarr/values-staging.yaml \
            --set image.tag="${{ github.sha }}" \
            --set app.environment="staging" \
            --set ingress.hosts[0].host="staging.mvidarr.example.com" \
            --wait \
            --timeout=10m

      - name: Verify deployment
        run: |
          kubectl get pods -n mvidarr-staging
          kubectl rollout status deployment/mvidarr-staging -n mvidarr-staging --timeout=300s

      - name: Run integration tests
        run: |
          # Wait for service to be ready
          sleep 60
          
          # Test health and API endpoints
          kubectl port-forward -n mvidarr-staging service/mvidarr-staging 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 5
          
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8080/api/monitoring/readiness || exit 1
          kill $PORT_FORWARD_PID

  # Deploy to production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build, deploy-staging]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-prod]'))
    environment:
      name: production
      url: https://mvidarr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${HELM_VERSION}

      - name: Pre-deployment backup
        run: |
          # Backup current Helm release
          helm get values mvidarr-prod -n mvidarr > /tmp/mvidarr-prod-backup.yaml || echo "No existing release"
          
          # Backup database (if using in-cluster DB)
          kubectl create job -n mvidarr backup-$(date +%Y%m%d-%H%M%S) \
            --from=cronjob/mvidarr-database-backup || echo "No backup job template"

      - name: Deploy with Helm (Blue-Green)
        run: |
          # Deploy to green environment first
          helm upgrade --install mvidarr-prod-green kubernetes/helm/mvidarr \
            --namespace mvidarr \
            --values kubernetes/helm/mvidarr/values.yaml \
            --values kubernetes/helm/mvidarr/values-prod.yaml \
            --set image.tag="${{ github.sha }}" \
            --set app.environment="production" \
            --set nameOverride="mvidarr-green" \
            --set ingress.hosts[0].host="green.mvidarr.example.com" \
            --wait \
            --timeout=15m

      - name: Verify green deployment
        run: |
          kubectl get pods -n mvidarr -l app.kubernetes.io/name=mvidarr-green
          kubectl rollout status deployment/mvidarr-green -n mvidarr --timeout=300s

      - name: Run production tests
        run: |
          # Wait for service to be ready
          sleep 60
          
          # Test green deployment
          kubectl port-forward -n mvidarr service/mvidarr-green 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 10
          
          # Comprehensive health checks
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8080/api/monitoring/readiness || exit 1
          curl -f http://localhost:8080/api/monitoring/liveness || exit 1
          
          kill $PORT_FORWARD_PID

      - name: Switch traffic to green (Blue-Green deployment)
        run: |
          # Update main service to point to green deployment
          kubectl patch service mvidarr-prod -n mvidarr -p '{"spec":{"selector":{"app.kubernetes.io/name":"mvidarr-green"}}}'
          
          # Wait for traffic switch
          sleep 30

      - name: Final verification
        run: |
          # Verify main service is working
          kubectl port-forward -n mvidarr service/mvidarr-prod 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 5
          
          curl -f http://localhost:8080/health || exit 1
          kill $PORT_FORWARD_PID

      - name: Cleanup old blue deployment
        run: |
          # Remove old blue deployment after successful green deployment
          helm uninstall mvidarr-prod-blue -n mvidarr || echo "No blue deployment to remove"

  # Rollback job (manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    environment:
      name: production
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${HELM_VERSION}

      - name: Rollback Helm release
        run: |
          helm rollback mvidarr-prod -n mvidarr
          kubectl rollout status deployment/mvidarr-prod -n mvidarr --timeout=300s

      - name: Verify rollback
        run: |
          kubectl get pods -n mvidarr
          
          # Test rolled back deployment
          kubectl port-forward -n mvidarr service/mvidarr-prod 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 5
          
          curl -f http://localhost:8080/health || exit 1
          kill $PORT_FORWARD_PID

  # Cleanup job
  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    needs: [deploy-dev, deploy-staging, deploy-production]
    steps:
      - name: Configure kubectl (dev)
        if: needs.deploy-dev.result == 'success'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
          # Cleanup old ReplicaSets and completed Jobs
          kubectl delete replicasets -n mvidarr-dev --field-selector='status.replicas=0'
          kubectl delete jobs -n mvidarr-dev --field-selector='status.conditions[0].type=Complete'

      - name: Cleanup container images
        run: |
          # Keep only the last 10 container image tags
          echo "Cleanup would remove old container images (implement with registry API)"