name: Playwright E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: mvidarr_test
          MYSQL_DATABASE: mvidarr_test
          MYSQL_USER: mvidarr_test
          MYSQL_PASSWORD: mvidarr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Set up test database
        run: |
          mysql -h 127.0.0.1 -u mvidarr_test -pmvidarr_test mvidarr_test < database/schema.sql || true
          mysql -h 127.0.0.1 -u mvidarr_test -pmvidarr_test mvidarr_test < database/seed_test_data.sql || true
        continue-on-error: true

      - name: Set up test configuration
        run: |
          cat > .env.test << EOF
          DATABASE_HOST=127.0.0.1
          DATABASE_PORT=3306
          DATABASE_NAME=mvidarr_test
          DATABASE_USER=mvidarr_test
          DATABASE_PASSWORD=mvidarr_test
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          SECRET_KEY=test_secret_key_for_playwright
          DEBUG=false
          TESTING=true
          EOF

      - name: Start MVidarr application
        run: |
          python fastapi_app.py &
          echo $! > mvidarr.pid

          # Wait for application to start
          timeout 120 bash -c 'until curl -f http://localhost:5000/health; do sleep 2; done'
        env:
          ENV_FILE: .env.test

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: |
          npx playwright test --project=${{ matrix.browser }} --reporter=html,json,list
        env:
          CI: true
          MVIDARR_BASE_URL: http://localhost:5000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            tests/playwright/playwright-report/
            tests/playwright/playwright-results.json
            tests/playwright/test-results/
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: tests/playwright/test-results/**/**.png
          retention-days: 7

      - name: Upload failure videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-videos-${{ matrix.browser }}
          path: tests/playwright/test-results/**/**.webm
          retention-days: 7

      - name: Stop MVidarr application
        if: always()
        run: |
          if [ -f mvidarr.pid ]; then
            kill $(cat mvidarr.pid) || true
          fi

      - name: Collect application logs
        if: always()
        run: |
          mkdir -p logs
          cp -r /tmp/mvidarr*.log logs/ || true
          cp -r data/logs/*.log logs/ || true

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs-${{ matrix.browser }}
          path: logs/
          retention-days: 7

  report:
    name: Generate Test Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate combined report
        run: |
          echo "# Playwright Test Results" > REPORT.md
          echo "" >> REPORT.md
          echo "## Test Execution Summary" >> REPORT.md
          echo "" >> REPORT.md

          for browser in chromium firefox webkit; do
            if [ -f "playwright-results-${browser}/playwright-results.json" ]; then
              echo "### ${browser}" >> REPORT.md
              echo "" >> REPORT.md

              # Extract test stats from JSON (basic parsing)
              total=$(grep -o '"tests":\[' "playwright-results-${browser}/playwright-results.json" | wc -l || echo "0")
              echo "- Total tests: ${total}" >> REPORT.md
              echo "" >> REPORT.md
            fi
          done

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-combined
          path: REPORT.md
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';

            try {
              report = fs.readFileSync('REPORT.md', 'utf8');
            } catch (e) {
              report = '## Playwright Test Results\n\nTest report generation failed.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  notification:
    name: Send Notifications
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check test status
        run: |
          echo "Test job status: ${{ needs.test.result }}"

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "Tests failed - notification would be sent"
            # Add notification logic here (Slack, email, etc.)
          fi
