# MVidarr - Simple Production Docker Compose
# For self-hosted music video collection management
#
# Quick Start:
#   1. Copy .env.simple.example to .env and configure
#   2. Run: docker-compose -f docker-compose.simple.yml up -d
#   3. Access MVidarr at http://localhost:5000
#
# Update MVidarr:
#   Run: ./scripts/deploy.sh
#
# Rollback:
#   Run: ./scripts/rollback.sh

services:
  # MVidarr Application
  mvidarr:
    image: ghcr.io/prefect421/mvidarr:latest
    container_name: mvidarr-app
    restart: unless-stopped
    ports:
      - "${MVIDARR_PORT:-5000}:5000"
    environment:
      # Application Settings
      - NODE_ENV=production
      - PORT=5000
      - DEBUG=false
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-UTC}

      # Database Connection
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=mvidarr
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=mvidarr

      # Redis Connection (Required for background jobs)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Security
      - SECRET_KEY=${SECRET_KEY}
      - MVIDARR_SECRET_KEY=${SECRET_KEY}

      # Optional API Keys
      - IMVDB_API_KEY=${IMVDB_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}

      # MeTube Integration (yt-dlp Web UI)
      - METUBE_URL=${METUBE_URL:-http://metube:8081}

    volumes:
      # Required: Your music video collection
      - ${MUSIC_VIDEOS_PATH}:/app/data/musicvideos

      # Required: Application data
      - ${DATA_PATH}/thumbnails:/app/data/thumbnails
      - ${DATA_PATH}/database:/app/data/database
      - ${DATA_PATH}/logs:/app/data/logs
      - ${DATA_PATH}/downloads:/app/data/downloads
      - ${DATA_PATH}/cache:/app/data/cache
      - ${DATA_PATH}/backups:/app/data/backups

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mvidarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "mvidarr.service=main"
      - "mvidarr.version=1.0.0"

  # MariaDB Database (Required)
  mariadb:
    image: mariadb:11.4
    container_name: mvidarr-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=mvidarr
      - MYSQL_USER=mvidarr
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_PATH}/mariadb:/var/lib/mysql
    networks:
      - mvidarr-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "mvidarr.service=database"

  # Redis Cache (Required for background jobs)
  redis:
    image: redis:7-alpine
    container_name: mvidarr-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_PATH}/redis:/data
    networks:
      - mvidarr-network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "mvidarr.service=cache"

  # MeTube - yt-dlp Web UI (Optional but recommended for downloading)
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: mvidarr-metube
    restart: unless-stopped
    ports:
      - "${METUBE_PORT:-8081}:8081"
    environment:
      - DOWNLOAD_DIR=/downloads
      - STATE_DIR=/downloads/.metube
      - TZ=${TZ:-UTC}
    volumes:
      - ${MUSIC_VIDEOS_PATH}:/downloads
    networks:
      - mvidarr-network
    profiles:
      - metube
    labels:
      - "mvidarr.service=downloader"

networks:
  mvidarr-network:
    driver: bridge

# Health Check Summary:
# - MVidarr: http://localhost:5000/api/health/dashboard
# - MariaDB: Automatic health checks
# - Redis: Automatic health checks
# - All services auto-restart on failure
