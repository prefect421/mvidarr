# MVidarr Dev Test Environment - Simplified 3-Container Architecture
# Deployment location: /home/mike/Docker_Drives/mvidarr-Test/
# Access: http://localhost:5001

services:
  mvidarr:
    image: ghcr.io/prefect421/mvidarr:dev
    entrypoint: >
      sh -c "
        echo 'Waiting for MariaDB and Redis to be ready...';
        while ! nc -z mvidarr-mariadb 3306 || ! nc -z mvidarr-redis 6379; do
          echo 'Services not ready, waiting...';
          sleep 3;
        done;
        echo 'Services ready, setting up environment...';
        PUID=\$${PUID:-1000};
        PGID=\$${PGID:-1000};
        usermod -u \$$PUID mvidarr 2>/dev/null || true;
        groupmod -g \$$PGID mvidarr 2>/dev/null || true;
        echo 'Creating required directories...';
        mkdir -p /app/data/database /app/data/thumbnails/artists /app/data/cache /app/data/downloads /app/data/logs /app/data/musicvideos /app/data/music_videos;
        chown -R \$$PUID:\$$PGID /app/data /app/logs;
        touch /app/data/database/.initialized || true;
        echo 'Starting MVidarr with supervisord (FastAPI + Celery)...';
        umask \$${UMASK_SET:-022};
        exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf;
      "
    container_name: mvidarr
    ports:
      - "0.0.0.0:5001:5000"
    environment:
      # Database Configuration
      - DB_HOST=mvidarr-mariadb
      - DB_PORT=3306
      - DB_USER=mvidarr
      - DB_PASSWORD=secure_password
      - DB_NAME=mvidarr

      # Application Settings
      - SECRET_KEY=mvidarr-dev-key-change-in-production
      - MVIDARR_SECRET_KEY=mvidarr-dev-key-change-in-production
      - DEBUG=true
      - PYTHONUNBUFFERED=1
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000

      # Scheduler Settings
      - MVIDARR_USE_ENHANCED_SCHEDULER=true
      - MVIDARR_AUTO_DOWNLOAD_ENABLED=true
      - MVIDARR_AUTO_DOWNLOAD_SCHEDULE=hourly
      - MVIDARR_AUTO_DOWNLOAD_TIME=03:15
      - MVIDARR_SCHEDULER_HEALTH_CHECK=true

      # Redis Configuration (with password)
      - REDIS_HOST=mvidarr-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=mvidarr_redis_password
      - REDIS_URL=redis://:mvidarr_redis_password@mvidarr-redis:6379/0
      - REDIS_DB=0

      # Celery Configuration (runs inside this container via supervisord)
      - CELERY_BROKER_URL=redis://:mvidarr_redis_password@mvidarr-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:mvidarr_redis_password@mvidarr-redis:6379/1
      - BACKGROUND_JOBS_ENABLED=true
      - JOB_SYSTEM_ENABLED=true
      - JOB_WORKER_COUNT=3
      - JOB_WEBSOCKET_ENABLED=true

    volumes:
      - /home/mike/Docker_Drives/mvidarr-Test/data/downloads:/app/data/downloads
      - /home/mike/Docker_Drives/mvidarr-Test/data/music_videos:/app/data/musicvideos
      - /home/mike/Docker_Drives/mvidarr-Test/data/database:/app/data/database
      - /home/mike/Docker_Drives/mvidarr-Test/data/thumbnails:/app/data/thumbnails
      - /home/mike/Docker_Drives/mvidarr-Test/data/logs:/app/data/logs
      - /home/mike/Docker_Drives/mvidarr-Test/data/cache:/app/data/cache
    depends_on:
      - mvidarr-mariadb
      - mvidarr-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mvidarr-network

  mvidarr-mariadb:
    image: mariadb:11.4
    container_name: mvidarr-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=mvidarr
      - MYSQL_USER=mvidarr
      - MYSQL_PASSWORD=secure_password
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
      - TZ=America/New_York
    volumes:
      - /home/mike/Docker_Drives/mvidarr-Test/database/mariadb:/var/lib/mysql
    ports:
      - "0.0.0.0:3305:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mvidarr-network

  mvidarr-redis:
    image: redis:7-alpine
    container_name: mvidarr-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /home/mike/Docker_Drives/mvidarr-Test/data/redis:/data
    command: redis-server --appendonly yes --requirepass mvidarr_redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mvidarr_redis_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mvidarr-network
    environment:
      - TZ=America/New_York
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mvidarr-network:
    driver: bridge
