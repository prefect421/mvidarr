<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MVidarr</title>
    <link rel="stylesheet" href="{{ url_for('frontend.css_files', filename='themes.css') }}">
    <style>
        /* Fixed dark mode, Default theme tokens only — see Global Constraints
           in docs/superpowers/plans/2026-08-09-auth-cluster.md for why this
           page doesn't fetch the instance's configured theme. */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary, #1a1a1a);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary, #ffffff);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 60%;
            background: radial-gradient(ellipse at center, color-mix(in srgb, var(--text-accent, #4a9eff) 16%, transparent) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            background: var(--bg-card, #2a2a2a);
            border: 1px solid var(--border-primary, #444444);
            border-radius: 10px;
            box-shadow: 0 12px 40px var(--shadow, rgba(0,0,0,0.3));
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            margin: 1rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
            color: var(--text-accent, #4a9eff);
            font-size: 14px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin: 0;
            font-weight: 600;
        }

        .logo p {
            color: var(--text-secondary, #cccccc);
            margin: 6px 0 0 0;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary, #cccccc);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--input-border, #555555);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background: var(--input-bg, #3a3a3a);
            color: var(--input-text, #ffffff);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--input-focus, #4a9eff);
        }

        .login-button {
            width: 100%;
            padding: 0.75rem;
            background: var(--btn-primary-bg, #4a9eff);
            color: var(--btn-primary-text, #ffffff);
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .oauth-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-primary, #444444);
        }

        .oauth-title {
            text-align: center;
            color: var(--text-secondary, #cccccc);
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .oauth-button {
            width: 100%;
            padding: 0.65rem;
            margin-bottom: 8px;
            border: 1px solid var(--border-primary, #444444);
            border-radius: 6px;
            background: transparent;
            color: var(--text-primary, #ffffff);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .error-message {
            background: color-mix(in srgb, var(--error, #dc3545) 18%, transparent);
            color: var(--error-color, #ff6b6b);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        #twoFactorSection {
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 0.5rem;
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>MVidarr</h1>
            <p>Music Video Management System</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-button" id="loginButton">Sign In</button>
        </form>

        <form id="twoFactorForm">
            <div id="twoFactorSection" class="form-group">
                <label for="twoFactorToken">Verification Code</label>
                <input type="text" id="twoFactorToken" name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
                <button type="submit" class="login-button" id="twoFactorButton" style="margin-top: 12px;">Verify</button>
            </div>
        </form>

        {% if oauth_providers %}
        <div class="oauth-section">
            <div class="oauth-title">Or sign in with</div>
            {% for provider, name in oauth_providers.items() %}
            <a href="/api/auth/oauth/{{ provider }}/login" class="oauth-button">
                {{ name }}
            </a>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const twoFactorForm = document.getElementById('twoFactorForm');
        const twoFactorSection = document.getElementById('twoFactorSection');
        const errorMessage = document.getElementById('errorMessage');
        let pendingUsername = null;

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const button = document.getElementById('loginButton');
            button.disabled = true;
            button.textContent = 'Signing In...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/simple-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/';
                } else if (response.status === 202 && data.requires_2fa) {
                    pendingUsername = username;
                    loginForm.style.display = 'none';
                    twoFactorSection.style.display = 'block';
                } else {
                    showError(data.detail || data.message || 'Login failed');
                }
            } catch (err) {
                showError('Login failed — could not reach the server');
            } finally {
                button.disabled = false;
                button.textContent = 'Sign In';
            }
        });

        twoFactorForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const button = document.getElementById('twoFactorButton');
            button.disabled = true;
            button.textContent = 'Verifying...';

            const token = document.getElementById('twoFactorToken').value;

            try {
                const response = await fetch('/2fa/api/verify-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: pendingUsername, token }),
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.detail || data.message || 'Verification failed');
                }
            } catch (err) {
                showError('Verification failed — could not reach the server');
            } finally {
                button.disabled = false;
                button.textContent = 'Verify';
            }
        });

        document.querySelectorAll('.oauth-button').forEach(function (button) {
            button.addEventListener('click', async function (e) {
                e.preventDefault();
                hideError();

                try {
                    const response = await fetch(button.getAttribute('href'));
                    const data = await response.json();

                    if (response.ok && data.auth_url) {
                        window.location.href = data.auth_url;
                    } else {
                        showError(data.detail || data.message || 'OAuth login failed');
                    }
                } catch (err) {
                    showError('OAuth login failed — could not reach the server');
                }
            });
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
