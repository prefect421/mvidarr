# MVidarr - Production Docker Compose
# Simple 3-container deployment: MVidarr, MariaDB, Redis
# FastAPI + Celery worker managed by supervisord in the main container

version: '3.8'

services:
  mvidarr:
    image: ghcr.io/prefect421/mvidarr:latest
    container_name: mvidarr
    ports:
      - "${MVIDARR_PORT:-5000}:5000"
    environment:
      # Database Configuration
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-mvidarr}

      # Application Security
      - SECRET_KEY=${SECRET_KEY}
      - MVIDARR_SECRET_KEY=${SECRET_KEY}

      # Optional API Keys
      - IMVDB_API_KEY=${IMVDB_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}

      # Application Settings
      - DEBUG=false
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-America/New_York}

      # User/Group IDs (for file permissions)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mvidarr_redis_default}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-mvidarr_redis_default}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-mvidarr_redis_default}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-mvidarr_redis_default}@redis:6379/1

      # Background Jobs
      - BACKGROUND_JOBS_ENABLED=true
      - JOB_SYSTEM_ENABLED=true
      - JOB_WORKER_COUNT=3
    volumes:
      - ${MUSIC_VIDEOS_PATH}:/app/data/musicvideos
      - ${DOWNLOADS_PATH:-./data/downloads}:/app/data/downloads
      - ${THUMBNAILS_PATH:-./data/thumbnails}:/app/data/thumbnails
      - ${DATABASE_PATH:-./data/database}:/app/data/database
      - ${LOGS_PATH:-./data/logs}:/app/data/logs
      - ${CACHE_PATH:-./data/cache}:/app/data/cache
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mvidarr

  mariadb:
    image: mariadb:11.4
    container_name: mvidarr-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-mvidarr}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
      - TZ=${TZ:-America/New_York}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mvidarr

  redis:
    image: redis:7-alpine
    container_name: mvidarr-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-mvidarr_redis_default}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mvidarr_redis_default}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mvidarr
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  mvidarr:
    driver: bridge
